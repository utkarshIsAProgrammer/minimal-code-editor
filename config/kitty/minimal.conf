# ===================================================================
# Minimal Code Editor - Dedicated Kitty Terminal Configuration
# ===================================================================

# Optionally inherit user's base kitty config if it exists
include kitty.conf

# Typography
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Window Layout & Padding
remember_window_size   no
initial_window_width   110c
initial_window_height  32c
window_padding_width   4
hide_window_decorations yes
confirm_os_window_close 0

# Colors & Transparency (Matching Minimal Dark Magic Theme)
background            #07070f
foreground            #bbccee
background_opacity    0.95
dynamic_background_opacity yes

# Cursor
cursor_shape          beam
cursor_blink_interval 0.5

# Performance
repaint_delay   2
input_delay     0
sync_to_monitor yes
