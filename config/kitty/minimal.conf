# ===================================================================
# Minimal Code Editor - Dedicated Kitty Terminal Configuration
# ===================================================================

# Optionally inherit user's base kitty config if it exists
globinclude kitty.conf


# Typography
font_family      CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Keybindings: Line Insertion (Ctrl+Shift+Enter and Ctrl+Enter)
# Overrides Kitty's default new_window so Ctrl+Shift+Enter inserts line above
map ctrl+shift+enter send_text all \x1b[13;6u
map kitty_mod+enter  send_text all \x1b[13;6u
map ctrl+enter       send_text all \x1b[13;5u

# Keybindings: Toggle Terminal (Ctrl+` and Ctrl+~)
map ctrl+grave       send_text all \x1b[96;5u
map ctrl+asciitilde  send_text all \x1b[126;5u

# Keybindings: Word deletion (Ctrl+Backspace and Ctrl+Delete)
map ctrl+backspace send_text all \x17
map ctrl+delete    send_text all \x1b[3;5~

# Window Layout & Padding
remember_window_size   no
initial_window_width   110c
initial_window_height  32c
window_padding_width   4
hide_window_decorations yes
confirm_os_window_close 0

# Colors & Transparency (Matching Minimal Dark Magic Theme)
background            #07070f
foreground            #bbccee
background_opacity    0.95
dynamic_background_opacity yes
background_blur       32

# Allow remote control and Kitty graphics protocol
allow_remote_control  yes
listen_on             unix:@kitty

# Cursor (Beam in all states)
cursor_shape          beam
cursor_blink_interval 0.5

# Performance
repaint_delay   2
input_delay     0
sync_to_monitor yes
